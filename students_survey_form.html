<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact us Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a Student Survey form 2026.">
  </head>

  <body>
    <main>
      <h1 id="title">Students Survey</h1>

      <p id="description">Fill this form to attend the <strong>High School Student survey 2026</strong></p>

      <fieldset>
        <legend>Details:</legend>
        <form id="survey-form">

          <!--Name-->
          <label id="name-label" for="name">Name:</label>
          <input id="name" type="text" required autocomplete='off' autofocus placeholder="Eg: Jack Sparrow">

          <!--Email-->
          <label id="email-label" for="email">Email:</label>
          <input required type="email" id="email" autocomplete="off" placeholder="Eg: hello@email.com"
          >

          <!--Phone number-->
          <label id="number-label" for="number">Phone Number:</label>
          <input id="number" type="number" required placeholder="Eg:9150000002" min="1000000000" max="9999999999">

          <!--Year of study-->
          <label id="year-of-study-label" for="dropdown">Year of Study:</label>
          <select id="dropdown" name="year-of-study" required>
            <option disabled selected>Select</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
          </select>


           <!--Intrest-->
          <fieldset>

            <legend>Intrest:</legend>

            <label id="frontend-label" for="frontend">Frontend</label>
            <input type="radio" name="intrest" value="Frontend" id="frontend">

            <lebel id="backend-label" for="backend">Backend</label>
            <input type="radio" id="backend" value="backend" name="intrest"></input>

            <label id="mobile-dev-label" for="mobile-dev">Mobile Development</label>
            <input id="mobile-dev" type="radio" value="mobile-development" name="intrest">

            <label id="game-dev-label" for="game-dev">Game Development</lebel>
            <input id="game-dev" name="intrest" value="game-development" type="radio">

            <label for="desktop-software" id="desktop-software-label">Desktop Software</label>
            <input id="desktop-software" value="desktop-software" name="intrest" type="radio">

            <label for="cloud-computing" >Cloud Computing</label>
            <input type="radio" value="cloud-comuting" id="cloud-computing" name="intrest">


          </fieldset>

          <!--Language-->
          <fieldset>
            <legend>Languages:</legend>
            
            
            <label for="python-label" id="python">Python<label>
            <input type="checkbox" id="python" value="python" name="lang">

            <label id="c-label" for="c">C language</label>
            <input type="checkbox" id="c" value="c" name="lang">

            <label id="cpp-label" for="cpp">C++ Language</label>
            <input type="checkbox" id="cpp" value="cpp" name="lang">

            <label for="java" id="java-label">Java</label>
            <input type="checkbox" id="java" value="java" name="lang">

            <label for="rust" id="rust-label">Rust</label>
            <input type="checkbox" id="go" value="go" name="lang">

            <label id="rust-label" for="rust">Rust</label>
            <input type="checkbox" id="rust" value="rust" name="lang">

            <label  id="js-label" for="js">JavaScript</label>
            <input type="checkbox" id="js" value="js" name="lang">

            <label id="ts-label" for="ts">Type Script</label>
            <input type="checkbox" id="ts" value="ts" name="lang">
          </fieldset>

          <!--description-->
          <label for="desc" id="desc-label">Description</label>
          <textarea id="desc" name="description" placeholder="Explain about yourself" rows="10" cols="50"></textarea>

          <button type="submit" id="submit">Submit</button>


        </form>
      </fieldset>
    </main>
  </body>
</html>
